services:
  # 后端服务
  - type: web
    name: chattalk-backend
    runtime: python
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: python -m app.core.init_db && uvicorn app.main:app --host 0.0.0.0 --port $PORT
    plan: free
    healthCheckPath: /docs
    envVars:
      - key: DATABASE_URL
        value: sqlite:///./chattalk.db
      - key: SECRET_KEY
        generateValue: true
      - key: ALGORITHM
        value: HS256
      - key: ACCESS_TOKEN_EXPIRE_MINUTES
        value: 10080
      - key: OCR_API_BASE
        value: https://api.siliconflow.cn/v1
      - key: OCR_API_KEY
        sync: false  # 需要手动设置
      - key: OCR_MODEL
        value: Pro/Qwen/Qwen2-VL-7B-Instruct
      - key: CORS_ORIGINS
        sync: false  # 部署后需要添加前端域名
