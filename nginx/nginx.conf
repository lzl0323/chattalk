# AI 对话系统 Nginx 配置
# 适用于生产环境部署

# 上游后端服务
upstream fastapi_backend {
    server 127.0.0.1:8000;
    keepalive 32;
}

# HTTP 服务器 - 重定向到 HTTPS (可选)
# server {
#     listen 80;
#     server_name your-domain.com;
#     return 301 https://$server_name$request_uri;
# }

# 主服务器配置
server {
    listen 80;
    # listen 443 ssl http2;  # 启用 HTTPS
    server_name localhost;  # 修改为你的域名
    
    # SSL 证书配置 (如果使用 HTTPS)
    # ssl_certificate /path/to/your/certificate.crt;
    # ssl_certificate_key /path/to/your/private.key;
    # ssl_protocols TLSv1.2 TLSv1.3;
    # ssl_ciphers HIGH:!aNULL:!MD5;
    # ssl_prefer_server_ciphers on;
    
    # 日志配置
    access_log /var/log/nginx/ai_chat_access.log;
    error_log /var/log/nginx/ai_chat_error.log;
    
    # 安全头
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    
    # Gzip 压缩
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css text/xml text/javascript 
               application/x-javascript application/xml+rss 
               application/javascript application/json;
    
    # 客户端上传大小限制
    client_max_body_size 10M;
    
    # API 代理 - 转发到 FastAPI 后端
    location /api/ {
        # 代理设置
        proxy_pass http://fastapi_backend/api/;
        proxy_http_version 1.1;
        
        # 请求头转发
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        
        # 流式响应支持 - 关键配置
        proxy_buffering off;              # 禁用代理缓冲
        proxy_cache off;                   # 禁用缓存
        proxy_set_header Connection '';    # 保持连接
        chunked_transfer_encoding off;     # 禁用分块传输编码
        
        # 超时设置
        proxy_connect_timeout 300s;
        proxy_send_timeout 300s;
        proxy_read_timeout 300s;
        
        # WebSocket 支持 (如果需要)
        # proxy_set_header Upgrade $http_upgrade;
        # proxy_set_header Connection "upgrade";
    }
    
    # 健康检查端点
    location /api/health {
        proxy_pass http://fastapi_backend/api/health;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        access_log off;
    }
    
    # 静态文件服务 - Vue3 前端
    location / {
        # 修改为你的前端构建目录绝对路径
        root E:/PROJECT-lzl/vue+fastapi/frontend/dist;
        
        # 尝试按顺序查找文件
        try_files $uri $uri/ /index.html;
        
        # 静态资源缓存
        location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
            expires 1y;
            add_header Cache-Control "public, immutable";
        }
        
        # HTML 文件不缓存
        location ~* \.html$ {
            add_header Cache-Control "no-cache, no-store, must-revalidate";
        }
        
        # index.html 特殊处理
        location = /index.html {
            add_header Cache-Control "no-cache, no-store, must-revalidate";
        }
    }
    
    # favicon
    location = /favicon.ico {
        root E:/PROJECT-lzl/vue+fastapi/frontend/dist;
        access_log off;
        log_not_found off;
    }
    
    # 禁止访问隐藏文件
    location ~ /\. {
        deny all;
        access_log off;
        log_not_found off;
    }
}

